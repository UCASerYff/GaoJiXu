name: Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Run regressions and build the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
      - name: Smoke-test installation, existing data and uninstall
        run: python tests/smoke_install.py dist/GaoJiXu-Windows-4.06-x64.msi --register-shell
      - uses: actions/upload-artifact@v4
        with:
          name: GaoJiXu-Windows-4.06-x64
          if-no-files-found: error
          path: |
            windows/dist/GaoJiXu-Windows-4.06-x64.msi
            windows/dist/GaoJiXu-Windows-4.06-x64.msi.sha256
