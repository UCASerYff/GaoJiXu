name: Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build executables
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - name: Smoke-test the packaged exe
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:TEMP ("gaojixu-smoke-" + [guid]::NewGuid().ToString("n"))
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $libraryFile = Join-Path $dest "library.json"
          if (Test-Path $libraryFile) { throw "temp data dir already has library.json" }
          $port = 18768
          $exe = Join-Path (Get-Location) "dist\GaoJiXu.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "--data-dir", $dest, "--serve", "--no-browser", "--port", "$port"
          ) -PassThru -WindowStyle Hidden
          try {
            $page = $null
            $deadline = (Get-Date).AddSeconds(90)
            do {
              if ($proc.HasExited) { throw "GaoJiXu.exe exited early with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 3 -NoProxy
                if ($response.StatusCode -eq 200) { $page = $response; break }
              } catch {}
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            if (-not $page) { throw "packaged exe did not return HTTP 200" }
            $token = [regex]::Match($page.Content, 'name="gao-token" content="([^"]+)"').Groups[1].Value
            if (-not $token) { throw "HTTP 200 page did not include a session token" }
            $headers = @{ "X-Gao-Token" = $token }
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/library/create" -Headers $headers -ContentType "application/json" -Body "{}" -NoProxy | Out-Null
            if (-not (Test-Path $libraryFile)) { throw "creating a library did not write library.json" }
            $created = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -Headers $headers -NoProxy
            $accountId = @($created.accounts)[0].id
            if (-not $accountId) { throw "new library did not return an account id" }
            $entryBody = '{"kind":"expense","accountID":"' + $accountId + '","amount":3,"categoryID":"food","note":"CI smoke ledger"}'
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/ledger/save" -Headers $headers -ContentType "application/json" -Body $entryBody -NoProxy | Out-Null
            $saved = $null
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              try { $saved = Get-Content -Raw -Encoding UTF8 $libraryFile } catch { Start-Sleep -Milliseconds 300; continue }
              if ($saved -match "CI smoke ledger") { break }
              Start-Sleep -Milliseconds 300
            }
            if (-not $saved -or $saved -notmatch "CI smoke ledger") { throw "library.json does not contain the written ledger entry" }
            $listed = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -Headers $headers -NoProxy
            $entries = @($listed.entries)
            $found = $false
            foreach ($entry in $entries) {
              if ($entry.note -eq "CI smoke ledger") { $found = $true }
            }
            if (-not $found) { throw "reading the library did not return the written ledger entry" }
            Write-Output "smoke ok: HTTP 200, wrote and read library.json"
            try {
              Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/shutdown" -Headers $headers -ContentType "application/json" -Body "{}" -NoProxy | Out-Null
            } catch {}
            $exitDeadline = (Get-Date).AddSeconds(20)
            while (-not $proc.HasExited -and (Get-Date) -lt $exitDeadline) { Start-Sleep -Milliseconds 500 }
          } finally {
            if (-not $proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null }
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GaoJiXu-Windows-4.06
          if-no-files-found: error
          path: |
            windows/dist/GaoJiXu.exe
            windows/dist/GaoJiXu-cli.exe
