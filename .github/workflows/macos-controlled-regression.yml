name: macOS controlled regression
on:
  push:
    branches: ['codex/macos-full-verify-20261128-0fb5aee0e9']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm source and static workbench structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0fb5aee0e99de50becfdc5169c12944b5e38e1b2
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/macos-controlled-regression.yml
          test "$(uname -m)" = arm64
          python3 -B Tests/WorkbenchStructureRegression.py
      - name: Compile framework, host and WidgetKit and run official regressions
        shell: bash
        run: bash scripts/verify_macos.sh 4.06 8
      - name: Run isolated savings and adventure state safety
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/gaojixu-safety.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          export TMPDIR="$work"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          sources=(FixedIncomeModels FixedIncomeStore Models AccountingModels GameCatalog HeroStats SavingsStore StorePersistence StoreWidgetSnapshot StoreLedger StoreGoals StoreBattle StoreGameSystems MonthlyLedgerBridge WidgetSnapshot AppTheme CSVReview)
          input=()
          for source in "${sources[@]}"; do input+=("Sources/$source.swift"); done
          xcrun swiftc -swift-version 5 -parse-as-library -sdk "$sdk" -target arm64-apple-macosx14.0 \
            -module-cache-path "$work/cache" -D UNIT_TEST \
            -framework SwiftUI -framework AppKit -framework Combine -framework CoreText \
            -framework CryptoKit "${input[@]}" Tests/SavingsSafetyRegression.swift -o "$work/SavingsSafetyRegression"
          "$work/SavingsSafetyRegression"
      - name: Run offscreen SceneKit exploration rendering
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/gaojixu-scenekit.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          export TMPDIR="$work"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc -swift-version 5 -parse-as-library -sdk "$sdk" -target arm64-apple-macosx14.0 \
            -module-cache-path "$work/cache" -framework AppKit -framework SwiftUI \
            -framework SceneKit -framework ImageIO Sources/AppLanguage.swift GameWorld/*.swift \
            Tests/ExplorerWorldRegression.swift -o "$work/ExplorerWorldRegression"
          "$work/ExplorerWorldRegression" "$work/explorer"
          test "$(find "$work" -maxdepth 1 -name 'explorer-*.png' | wc -l | tr -d ' ')" = 7

