<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gao-token" content="{{TOKEN}}">
  <meta name="gao-version" content="{{VERSION}}">
  <link rel="icon" href="/assets/mac/GaoJiXuIcon.png">
  <link rel="stylesheet" href="/assets/workbench.css">
  <link rel="stylesheet" href="/assets/fixed.css">
  <link rel="stylesheet" href="/assets/widgets.css">
  <link rel="stylesheet" href="/assets/finance.css">
  <link rel="stylesheet" href="/assets/adventure.css">
  <script defer src="/assets/workbench.js"></script>
  <script defer src="/assets/csv-review.js"></script>
  <script defer src="/assets/finance-ui.js"></script>
  <script defer src="/assets/fixed.js"></script>
  <script defer src="/assets/adventure-scene.js"></script>
  <script defer src="/assets/adventure.js"></script>
  <script defer src="/assets/widgets.js"></script>
  <title>搞积蓄</title>
</head>
<body>
  <div id="app-frame">
    <header class="app-chrome">
      <div class="nav-rail">
        <div class="brand">
          <img src="/assets/mac/GaoJiXuIcon.png" width="36" height="36" alt="">
          <strong id="brand-name">搞积蓄</strong>
        </div>
        <nav id="workspaces" class="workspaces" aria-label="工作台"></nav>
        <div class="subbar" id="subbar" hidden><nav id="sections" aria-label="工作区内容"></nav></div>
        <div id="rail-tools" class="rail-tools" hidden></div>
      </div>
      <div class="topbar">
        <div class="open-context"><span id="context-workspace"></span><span id="context-section" hidden></span></div>
        <div class="toolbar" id="toolbar"></div>
      </div>
    </header>
    <main id="workbench">
      <div id="banner" class="banner app-state" role="status"><span class="state-spinner" aria-hidden="true"></span><strong>正在读取资料…</strong></div>
      <div class="subbar fixed-bar" id="fixed-bar" hidden><nav id="fixed-sections" aria-label="固定收支类型"></nav></div>
    <section id="overview" hidden></section>
    <section id="ledger" hidden></section>
    <section id="accounts" hidden></section>
    <section id="budgets" hidden></section>
    <section id="reports" hidden></section>
    <section id="fixed-income" hidden></section>
    <section id="fixed-expenses" hidden></section>
    <section id="benefits" hidden></section>
    <section id="goals" hidden></section>
    <section id="records" hidden></section>
    <section id="analytics" hidden></section>
    <section id="adventure" hidden></section>
    <section id="widgets" hidden></section>
    </main>
  </div>
  <aside id="feedback" class="app-feedback" role="alert" hidden>
    <div class="feedback-copy"><strong id="feedback-title"></strong><p id="feedback-content"></p></div>
    <button id="feedback-dismiss" class="icon-button ghost" type="button" aria-label="关闭">×</button>
  </aside>
  <dialog id="csv-review" aria-labelledby="csv-review-title">
    <div class="csv-review-shell">
      <header class="editor-header">
        <div><h2 id="csv-review-title"></h2><p data-csv-intro></p></div>
        <button type="button" class="icon-button ghost" data-csv-close autofocus>×</button>
      </header>
      <div class="editor-content">
        <form class="csv-upload">
          <label><span data-csv-file-label></span><input type="file" accept=".csv,text/csv" data-csv-file required></label>
          <button type="submit" data-csv-stage></button>
        </form>
        <p data-csv-error class="csv-error" role="alert" hidden></p>
        <div class="csv-review-body">
          <nav data-csv-batches></nav>
          <section data-csv-result></section>
        </div>
      </div>
      <footer class="editor-actions csv-review-actions">
        <p data-csv-status role="status"></p>
        <button type="button" class="ghost" data-csv-undo hidden></button>
        <button type="button" data-csv-apply hidden></button>
      </footer>
    </div>
  </dialog>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <div class="editor-header">
        <div><h2 id="editor-title"></h2><p id="editor-subtitle"></p></div>
        <button id="editor-close" class="icon-button ghost" type="button" aria-label="关闭">×</button>
      </div>
      <div id="editor-content" class="editor-content"></div>
      <div id="editor-error" role="alert" hidden></div>
      <div class="editor-actions"><button id="editor-cancel" class="ghost" type="button"></button><button id="editor-submit" type="submit"></button></div>
    </form>
  </dialog>
  <dialog id="decision" aria-labelledby="decision-title" aria-describedby="decision-content">
    <form method="dialog">
      <div class="editor-header"><div><h2 id="decision-title"></h2></div></div>
      <div class="editor-content"><p id="decision-content"></p></div>
      <div class="editor-actions"><button id="decision-cancel" class="ghost" value="cancel" autofocus></button><button id="decision-confirm" class="danger" value="confirm"></button></div>
    </form>
  </dialog>
  <dialog id="app-exit" aria-labelledby="app-exit-title" aria-describedby="app-exit-text">
    <form method="dialog">
      <div class="editor-header"><div><h2 id="app-exit-title"></h2></div></div>
      <div class="editor-content"><p id="app-exit-text"></p></div>
      <div class="editor-actions"><button class="ghost" value="cancel" data-exit-cancel autofocus></button><button class="danger" value="confirm" data-exit-confirm></button></div>
    </form>
  </dialog>
</body>
</html>
